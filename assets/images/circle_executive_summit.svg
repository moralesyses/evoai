  <text x="640" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="64" fill="url(#gold)">88</text>
  <text x="640" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="8" fill="url(#gold)">EXECUTIVE SUMMIT</text>
  <!-- stage -->
  <path d="M200 470 H1080 L1180 540 H100 Z" fill="#1d180d" stroke="url(#gold)" stroke-opacity="0.6" stroke-width="3"/>
