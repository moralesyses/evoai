<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Placeholder illustration of an 88MMM executive summit stage. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0907"/>
      <stop offset="60%" stop-color="#16120a"/>
      <stop offset="100%" stop-color="#050504"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#f3bd35" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f3bd35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
