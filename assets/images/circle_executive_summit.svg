      <stop offset="50%" stop-color="#f3bd35"/>
      <stop offset="100%" stop-color="#8f6510"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffda72" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffda72" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- light beams -->
